<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musavvir Print — Telegram bot</title>
    <meta name="description" content="Esdalik rasmlaringizni sifatli chop etamiz. Telegram botda buyurtma bering.">
    <meta property="og:title" content="Musavvir Print — buyurtma berish">
    <meta property="og:description" content="Esdalik rasmlaringizni sifatli chop etamiz. 300 tadan yetkazish bepul.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playball&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #e5005c; --pink-dark: #610027; --card: #e3dfd5; --ink: #2c2c2c; --gray: #a3a3a3; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 16px; background: #e4005e; color: var(--ink);
            font-family: 'Space Grotesk', system-ui, sans-serif;
        }
        .card {
            width: 100%; max-width: 380px; background: var(--card); border: 4px solid var(--gray);
            border-radius: 24px; box-shadow: 6px 6px 0 0 var(--ink); padding: 32px 24px; text-align: center;
        }
        .logo { font-family: 'Playball', cursive; color: var(--pink); font-size: 56px; line-height: 1; margin: 0; }
        .logo small { display: block; font-size: 22px; letter-spacing: .3em; margin-top: 4px; }
        p { font-weight: 700; line-height: 1.45; margin: 24px 0; }
        .btn {
            display: block; width: 100%; padding: 16px; border-radius: 14px; text-decoration: none;
            background: var(--pink); color: #fff; border: 2px solid var(--pink-dark);
            box-shadow: 4px 4px 0 var(--pink-dark); font-weight: 700; font-size: 18px;
            letter-spacing: .12em; text-transform: uppercase;
        }
        .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--pink-dark); }
        .note { font-size: 13px; opacity: .7; margin: 16px 0 0; }
        .spinner {
            width: 22px; height: 22px; border: 3px solid rgba(229,0,92,.25); border-top-color: var(--pink);
            border-radius: 50%; display: inline-block; vertical-align: middle; margin-right: 8px;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <main class="card">
        <h1 class="logo">musavir<small>— print —</small></h1>
        <p><span class="spinner" aria-hidden="true"></span>Telegram ochilmoqda…</p>
        <a id="open" class="btn" href="https://t.me/MusavvirPrint_bot">Telegram'da ochish</a>
        <p class="note">Ochilmasa, tugmani bosing. Botda «Start» bosib, buyurtma bering.</p>
    </main>
    <script>
        (function () {
            var BOT = 'MusavvirPrint_bot';
            var raw = new URLSearchParams(location.search).get('from') || 'link';
            var from = /^[a-z0-9_-]{1,32}$/i.test(raw) ? raw.toLowerCase() : 'link';
            var web = 'https://t.me/' + BOT + '?start=' + from;
            document.getElementById('open').href = web;
            // t.me o'zi telefonda Telegram ilovasini ochadi
            setTimeout(function () { location.replace(web); }, 700);
        })();
    </script>
</body>
</html>
