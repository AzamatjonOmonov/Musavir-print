<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musavvir Print — do'kon</title>
<meta name="description" content="Rasm chop etish, fotokniga, albomlar, ramkalar va tayyor to'plamlar. O'zbekiston bo'ylab BTS orqali yetkazamiz.">
<meta property="og:title" content="Musavvir Print — do'kon">
<meta property="og:description" content="Rasm chop etish, fotokniga, albomlar, ramkalar va tayyor to'plamlar.">
<meta property="og:image" content="/dokon/logo.png">
<meta name="theme-color" content="#e4005e">
<link rel="icon" href="/dokon/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f1f4;
    --surface: #ffffff;
    --ink: #2c2c2c;
    --muted: #77727a;
    --line: #e4e1e6;
    --pink: #e5005c;
    --pink-bg: #e4005e;
    --wine: #610027;
    --paper: #e3dfd5;
    --gray: #a3a3a3;
    --nokia: #9bb48f;
    --nokia-dark: #2a3b22;
    --ok: #1d7a45;
    --radius: 14px;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 'Space Grotesk', system-ui, sans-serif;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 3px solid var(--wine); outline-offset: 2px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---------- E'lon chizig'i ---------- */
  .ann { background: var(--wine); color: #fff; font-size: 14px; font-weight: 500; text-align: center; }
  .ann .wrap { min-height: 36px; display: grid; place-items: center; padding-top: 7px; padding-bottom: 7px; }
  .ann span { transition: opacity .35s; }
  .ann span.fade { opacity: 0; }

  /* ---------- Til tanlash ---------- */
  .langs { display: inline-flex; background: rgba(255,255,255,.18); border-radius: 10px; padding: 3px; gap: 2px; }
  .langs button { border: 0; background: none; color: #fff; padding: 5px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; }
  .langs button[aria-pressed="true"] { background: #fff; color: var(--pink); }
  .top-white .langs { background: var(--bg); }
  .top-white .langs button { color: var(--muted); }
  .top-white .langs button[aria-pressed="true"] { background: var(--surface); color: var(--pink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* ---------- Oq sarlavha (ichki sahifalarda) ---------- */
  header.top-white { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
  .top-row .logo img { height: 38px; width: auto; }

  /* ---------- Eski kalkulyator (asl dizayn) ---------- */
  .calc-band { background: var(--pink-bg); padding: 12px 0 36px; }
  .calc-band .bar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .calc-card {
    max-width: 448px; margin: 0 auto; background: var(--paper); border-radius: 24px; padding: 24px;
    border: 4px solid var(--gray); box-shadow: 6px 6px 0 0 var(--ink); position: relative;
  }
  @media (min-width: 768px) { .calc-card { padding: 32px; } }
  .calc-logo { display: flex; justify-content: center; padding: 8px 0; margin-bottom: 20px; }
  .calc-logo img { width: 100%; max-width: 300px; height: auto; }
  .fmt-tabs { display: flex; gap: 8px; margin: -4px 0 16px; flex-wrap: wrap; }
  .fmt-tabs button {
    flex: 1; min-width: 64px; padding: 8px 6px; border-radius: 10px; background: #fff; border: 2px solid var(--gray);
    font-weight: 700; letter-spacing: .06em; box-shadow: 2px 2px 0 var(--gray);
  }
  .fmt-tabs button[aria-pressed="true"] { background: var(--nokia-dark); color: var(--nokia); border-color: var(--nokia-dark); box-shadow: 2px 2px 0 var(--ink); }
  .fmt-tabs button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); margin-left: 5px; vertical-align: middle; }
  .screen {
    background: var(--nokia); border-radius: 12px; padding: 16px; margin-bottom: 28px; position: relative; overflow: hidden;
    border: 4px solid #7a996b; min-height: 14rem; display: flex; flex-direction: column;
    box-shadow: inset 4px 4px 10px rgba(0,0,0,.3), inset -2px -2px 5px rgba(255,255,255,.2);
  }
  .scanline {
    position: absolute; inset: 0; z-index: 1; opacity: .4; pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,.1) 50%, rgba(0,0,0,.1));
    background-size: 100% 4px;
  }
  .scr { position: relative; z-index: 2; display: flex; flex-direction: column; flex: 1; font-family: 'VT323', monospace; color: var(--nokia-dark); }
  .scr-top { display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--nokia-dark); padding-bottom: 4px; margin-bottom: 8px; opacity: .9; }
  .scr-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; padding: 8px 0; }
  .scr-main .l { font-size: 24px; opacity: .8; font-weight: 700; margin-bottom: 4px; }
  .scr-main .n { font-size: clamp(40px, 15vw, 60px); line-height: 1; display: flex; align-items: flex-end; white-space: nowrap; }
  @media (min-width: 768px) { .scr-main .n { font-size: 72px; } }
  .scr-main .n i { font-style: normal; font-size: 36px; margin: 0 0 4px 4px; animation: blink 1s step-end infinite; }
  .scr-main .c { font-size: 24px; opacity: .9; margin-top: 4px; font-weight: 700; }
  @keyframes blink { 50% { opacity: 0; } }
  .scr-free { position: relative; height: 56px; margin-top: auto; }
  .scr-free > div { position: absolute; inset: 0; transition: opacity .3s, transform .3s; opacity: 0; transform: translateY(8px); }
  .scr-free > div.on { opacity: 1; transform: none; }
  .scr-free .prog { display: flex; flex-direction: column; justify-content: flex-end; }
  .scr-free .prog .t { display: flex; justify-content: space-between; align-items: flex-end; font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; line-height: 1; margin-bottom: 4px; }
  .cells { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; border: 2px solid var(--nokia-dark); padding: 3px; border-radius: 2px; }
  .cells i { height: 10px; border-radius: 1px; }
  .cells i.f { background: var(--nokia-dark); }
  .scr-free .badge-free { top: auto; bottom: 0; background: var(--nokia-dark); color: var(--nokia); padding: 8px; text-align: center; font-size: 18px; font-weight: 700; line-height: 1.15; border-radius: 4px; }
  .calc-label { display: block; font-size: 14px; font-weight: 700; margin: 0 0 4px 8px; text-transform: uppercase; letter-spacing: .06em; }
  .tactile {
    width: 100%; border-radius: 12px; padding: 12px 16px; background: #fff; text-align: center; font-size: 24px; font-weight: 700;
    color: var(--pink); border: 2px solid var(--gray); box-shadow: inset 2px 2px 5px rgba(0,0,0,.1); transition: .2s; outline: 0;
  }
  .tactile::placeholder { color: #9ca3af; }
  .tactile:focus { border-color: var(--pink); box-shadow: inset 2px 2px 5px rgba(229,0,92,.15); }
  .retro-btn {
    width: 100%; margin-top: 20px; border-radius: 12px; padding: 16px; font-size: 20px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .12em; background: var(--pink); color: #fff; border: 2px solid var(--wine); box-shadow: 4px 4px 0 var(--wine);
    transition: transform .1s, box-shadow .1s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  }
  .retro-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--wine); }
  .retro-btn:disabled { opacity: .6; }
  .calc-note { text-align: center; font-size: 14px; font-weight: 700; color: rgba(44,44,44,.72); margin: 16px 0 0; line-height: 1.4; }
  .calc-note button { border: 0; background: none; padding: 0; color: var(--pink); text-decoration: underline; text-underline-offset: 3px; font-weight: 700; }

  /* ---------- Tovarlar ---------- */
  .section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 28px 0 12px; }
  .section-title h2 { margin: 0; font-size: 20px; }
  .section-title span { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 12px; padding: 0 12px; height: 44px; margin-bottom: 14px; border: 1px solid var(--line); }
  .search input { border: 0; background: transparent; outline: 0; width: 100%; height: 100%; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 14px; } }
  @media (min-width: 960px) { .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
  .card { display: flex; flex-direction: column; text-decoration: none; min-width: 0; }
  .shot { position: relative; aspect-ratio: 4 / 5; background: var(--surface); border-radius: var(--radius); box-shadow: 0 1px 0 var(--line); }
  .shot .img { position: absolute; inset: 7px 7px 24px; border-radius: 8px; overflow: hidden; background: var(--paper); }
  .shot img { width: 100%; height: 100%; object-fit: cover; }
  .ph { width: 100%; height: 100%; display: grid; place-items: center; color: #b5ad9c; }
  .badge { position: absolute; top: 13px; left: 13px; background: var(--wine); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
  .badge.sale { background: var(--pink); }
  .add-fab { position: absolute; right: 12px; bottom: 6px; width: 36px; height: 36px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); }
  .card .price { margin: 8px 2px 0; font-weight: 700; font-size: 17px; }
  .card .price s { display: block; font-weight: 400; color: var(--muted); font-size: 13px; line-height: 1.2; }
  .card .name { margin: 2px 2px 0; font-size: 14px; color: #4b464e; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .demo-note { margin-top: 16px; padding: 10px 12px; border-radius: 12px; background: #fff4d6; color: #6b4e00; font-size: 13px; }
  .skeleton { background: linear-gradient(90deg, #e9e7ec 0, #f4f3f6 50%, #e9e7ec 100%); background-size: 200% 100%; animation: sk 1.2s infinite linear; border-radius: var(--radius); aspect-ratio: 4/5; }
  @keyframes sk { to { background-position: -200% 0; } }

  /* ---------- Pastki qism: ijtimoiy tarmoqlar ---------- */
  footer.foot { margin-top: 36px; padding: 28px 0 24px; background: var(--surface); border-top: 1px solid var(--line); text-align: center; }
  footer.foot img { height: 44px; width: auto; margin: 0 auto 8px; }
  footer.foot p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .socials { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .socials a { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); text-decoration: none; font-weight: 500; font-size: 14px; }
  .socials a svg { flex: none; }
  .socials .tg svg { color: #229ed9; } .socials .ig svg { color: #d62976; } .socials .yt svg { color: #ff0000; } .socials .ad svg { color: var(--pink); }

  /* ---------- Tovar sahifasi ---------- */
  .pp { padding-bottom: 96px; }
  @media (min-width: 860px) { .pp-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; padding-top: 24px; } }
  .back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 12px 0; font-weight: 500; color: var(--muted); }
  .gallery { position: relative; margin: 0 -16px; }
  @media (min-width: 860px) { .gallery { margin: 0; } }
  .slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: var(--surface); }
  @media (min-width: 860px) { .slides { border-radius: 18px; } }
  .slides::-webkit-scrollbar { display: none; }
  .slides > div { flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 1; background: var(--paper); }
  .slides img { width: 100%; height: 100%; object-fit: cover; }
  .dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.6); box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .dots i.on { background: var(--pink); width: 18px; border-radius: 4px; }
  .pp h1 { font-size: 22px; line-height: 1.2; margin: 16px 0 6px; }
  .pp .big-price { font-size: 26px; font-weight: 700; }
  .pp .big-price s { font-size: 16px; font-weight: 400; color: var(--muted); margin-left: 8px; }
  .opt-title { font-weight: 700; margin: 20px 0 8px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 14px; text-align: left; line-height: 1.25; }
  .pill small { display: block; color: var(--muted); font-size: 13px; }
  .pill[aria-checked="true"] { border-color: var(--pink); box-shadow: inset 0 0 0 1px var(--pink); }
  .checks { display: grid; gap: 8px; }
  .check { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--pink); margin: 0; }
  .check span { flex: 1; }
  .check b { white-space: nowrap; }
  .desc { white-space: pre-line; color: #45404a; margin-top: 20px; background: var(--surface); padding: 14px 16px; border-radius: 14px; }
  .bundle-note { margin-top: 12px; font-size: 14px; color: var(--wine); background: #fde6ef; padding: 10px 14px; border-radius: 12px; }
  .buybar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 15; background: var(--surface); border-top: 1px solid var(--line); }
  .buybar .wrap { display: flex; gap: 10px; align-items: center; padding-top: 10px; padding-bottom: 10px; }
  .stepper { display: flex; align-items: center; background: var(--bg); border-radius: 12px; height: 48px; }
  .stepper button { width: 42px; height: 48px; border: 0; background: none; font-size: 22px; }
  .stepper output { min-width: 28px; text-align: center; font-weight: 700; }
  .btn { flex: 1; height: 48px; border-radius: 12px; border: 0; background: var(--pink); color: #fff; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 0 16px; }
  .btn:disabled { opacity: .55; }
  .btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }

  /* ---------- Savat ---------- */
  .cart h1 { font-size: 24px; margin: 18px 0 12px; }
  .lines { display: grid; gap: 10px; }
  .line { display: grid; grid-template-columns: 76px 1fr; gap: 12px; background: var(--surface); border-radius: 14px; padding: 10px; }
  .line .thumb { width: 76px; height: 92px; border-radius: 8px; overflow: hidden; background: var(--paper); }
  .line .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .line .thumb.print { background: var(--nokia); color: var(--nokia-dark); display: grid; place-items: center; font: 700 22px/1 'VT323', monospace; text-align: center; padding: 4px; }
  .line h4 { margin: 0; font-size: 15px; font-weight: 500; }
  .line .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .line .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
  .line .stepper { height: 38px; }
  .line .stepper button { height: 38px; width: 36px; font-size: 19px; }
  .line .sum { font-weight: 700; white-space: nowrap; }
  .line .acts { display: flex; gap: 14px; flex-wrap: wrap; }
  .line .rm { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px 0; text-decoration: underline; }
  .line.gone { opacity: .55; }
  .summary { background: var(--surface); border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
  .summary .total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; }
  .meter { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .meter .bar { height: 6px; background: var(--bg); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .meter .bar i { display: block; height: 100%; background: var(--pink); border-radius: 3px; }
  .meter.done { color: var(--ok); font-weight: 700; }
  form.checkout { background: var(--surface); border-radius: 14px; padding: 16px; margin-top: 12px; display: grid; gap: 14px; }
  form.checkout h3 { margin: 0; font-size: 18px; }
  label.f { display: grid; gap: 6px; font-weight: 500; font-size: 14px; }
  .field { display: flex; align-items: stretch; background: var(--bg); border-radius: 12px; border: 1.5px solid transparent; }
  .field:focus-within { border-color: var(--pink); background: var(--surface); }
  .field input, .field textarea { flex: 1; border: 0; background: transparent; outline: 0; padding: 12px 14px; min-width: 0; resize: none; }
  .field .pre { padding: 12px 0 12px 14px; color: var(--muted); }
  .loc { border: 0; background: none; padding: 0 14px; color: var(--pink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; border-left: 1px solid var(--line); }
  .loc.set { color: var(--ok); }
  .hint { font-size: 13px; color: var(--muted); }
  .err { color: #b00035; font-weight: 500; font-size: 14px; margin: 0; }
  .hp { position: absolute; left: -9999px; }

  /* ---------- Buyurtma qabul qilindi ---------- */
  .done-band { background: var(--pink-bg); padding: 28px 0 40px; }
  .done-card { max-width: 448px; margin: 0 auto; background: var(--paper); border-radius: 24px; padding: 28px 22px; border: 4px solid var(--gray); box-shadow: 6px 6px 0 0 var(--ink); text-align: center; }
  .done-card .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--nokia-dark); color: var(--nokia); display: grid; place-items: center; margin: 0 auto 14px; }
  .done-card h1 { margin: 0 0 6px; font-size: 24px; }
  .done-card p { margin: 0 0 4px; color: #4b464e; }
  .msg-preview { margin: 18px 0 0; text-align: left; background: #fff; border: 2px solid var(--gray); border-radius: 12px; padding: 12px 14px; font-size: 14px; white-space: pre-line; box-shadow: inset 2px 2px 5px rgba(0,0,0,.06); }
  .msg-preview b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
  .done-card .retro-btn { font-size: 17px; letter-spacing: .06em; }
  .done-card .alt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .done-card .alt a, .done-card .alt button { height: 46px; border-radius: 12px; border: 2px solid var(--gray); background: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .done-card .home { display: inline-block; margin-top: 16px; color: var(--muted); font-weight: 500; }

  /* ---------- Pastki menyu ---------- */
  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.bottom .wrap { display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
  nav.bottom a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 12px; color: var(--muted); position: relative; }
  nav.bottom a.on { color: var(--pink); }
  .count { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 84px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 12px; z-index: 50; opacity: 0; transition: .2s; pointer-events: none; font-size: 14px; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="ann" id="ann" hidden><div class="wrap"><span id="ann-text"></span></div></div>
<header class="top-white" id="top-white" hidden>
  <div class="wrap top-row">
    <a class="logo" href="#/" aria-label="Musavvir Print"><img src="/dokon/logo.png" alt="Musavvir Print" width="119" height="38"></a>
    <div class="langs" data-langs></div>
  </div>
</header>

<main id="view"></main>

<nav class="bottom" aria-label="Menu">

    var sale = p.old_price && p.old_price > p.price && !p.variants.length && !p.options.length;
    var badge = sale ? '<span class="badge sale">−' + Math.round((1 - p.price / p.old_price) * 100) + '%</span>'
      : p.is_bundle ? '<span class="badge">' + esc(t('bundle')) + '</span>' : '';
    var price = (p.variants.length > 1 || p.options.some(function (g) { return g.choices.length > 1; }))
      ? t('from', { p: sum(minPrice(p)) }) : sum(minPrice(p));
    return '<a class="card" href="#/p/' + encodeURIComponent(p.id) + '">' +
      '<div class="shot"><div class="img">' + img + '</div>' + badge +
      '<button class="add-fab" type="button" data-quick="' + esc(p.id) + '" aria-label="' + esc(t('add_cart') + ': ' + L(p, 'name')) + '">' + ICON_PLUS + '</button></div>' +
      '<div class="price">' + esc(price) + (sale ? '<s>' + fmt(p.old_price) + '</s>' : '') + '</div>' +
      '<div class="name">' + esc(L(p, 'name')) + '</div></a>';
  }

  function calcHTML() {
    var tabs = calcs.length > 1 ? '<div class="fmt-tabs" role="tablist">' + calcs.map(function (c) {
      return '<button type="button" role="tab" data-calc="' + esc(c.id) + '" aria-pressed="' + (c.id === calcId) + '" aria-selected="' + (c.id === calcId) + '">' +
        esc(L(c, 'name')) + (cart.calcs[c.id] > 0 ? '<span class="dot" aria-hidden="true"></span>' : '') + '</button>';
    }).join('') + '</div>' : '';
    var cells = ''; for (var i = 0; i < 12; i++) cells += '<i></i>';
    return '<section class="calc-band"><div class="wrap">' +
      '<div class="bar"><div class="langs" data-langs>' + langsHTML() + '</div></div>' +
      '<div class="calc-card">' +
        '<div class="calc-logo"><img src="/dokon/logo.png" alt="Musavvir Print" width="300" height="96"></div>' + tabs +
        '<div class="screen"><div class="scanline"></div><div class="scr">' +
          '<div class="scr-top"><span id="c-fmt"></span><span>' + esc(t('each')) + ': <span id="c-unit">0</span></span></div>' +
          '<div class="scr-main"><div class="l">' + esc(t('total')) + ':</div><div class="n"><span id="c-sum">0</span><i>_</i></div><div class="c">' + esc(t('som')) + '</div></div>' +
          '<div class="scr-free"><div class="prog" id="c-prog"><div class="t"><span id="c-left"></span><span>' + esc(t('free_short')) + '</span></div><div class="cells" id="c-cells">' + cells + '</div></div>' +
          '<div class="badge-free" id="c-badge">' + esc(t('free_badge')) + '</div></div>' +
        '</div></div>' +
        '<label class="calc-label" for="c-qty">' + esc(t('how_many')) + '</label>' +
        '<input class="tactile" type="number" id="c-qty" min="0" max="100000" inputmode="numeric" placeholder="0">' +
        '<button class="retro-btn" type="button" id="c-add"></button>' +
        '<p class="calc-note" id="c-note"></p>' +
      '</div></div></section>';
  }

  function wireCalc() {
    var inp = $('#c-qty');
    if (!inp) return;
    var c = calcById(calcId);
    if (!c) { $('.calc-card .screen').hidden = true; return; }
    inp.value = cart.calcs[calcId] > 0 ? cart.calcs[calcId] : '';
    function paint() {
      var q = Math.max(0, Math.min(100000, parseInt(inp.value, 10) || 0));
      var up = tierPrice(c, q);
      $('#c-fmt').textContent = L(c, 'name').toUpperCase();
      $('#c-unit').textContent = fmt(up);
      $('#c-sum').textContent = fmt(q * up);
      // bepul yetkazish: savatdagi boshqa rasmlar ham hisoblanadi
      var others = freeCount() - (c.free ? (cart.calcs[calcId] || 0) : 0);
      var n = others + (c.free ? q : 0);
      var showProg = n > 0 && n < FREE_FROM, showBadge = n >= FREE_FROM;
      $('#c-prog').classList.toggle('on', showProg);
      $('#c-badge').classList.toggle('on', showBadge);
      $('#c-left').textContent = t('left', { n: Math.max(0, FREE_FROM - n) });
      var filled = Math.round(Math.min(1, n / FREE_FROM) * 12);
      document.querySelectorAll('#c-cells i').forEach(function (cell, i) { cell.classList.toggle('f', i < filled); });
      var inCart = cart.calcs[calcId] > 0;
      var btn = $('#c-add');
      btn.textContent = inCart && q !== cart.calcs[calcId] ? t('update_cart') : inCart ? t('in_cart', { n: q }) : t('add_cart');
      btn.disabled = !q || (inCart && q === cart.calcs[calcId]);
      $('#c-note').innerHTML = inCart
        ? esc(t('in_cart', { n: cart.calcs[calcId] })) + ' · <button type="button" id="c-rm">' + esc(t('remove')) + '</button>'
        : t('other_formats', { a: '<a href="' + LINKS.admin + '" target="_blank" rel="noopener" style="color:var(--pink)">', b: '</a>' });
      var rm = $('#c-rm');
      if (rm) rm.onclick = function () { delete cart.calcs[calcId]; saveCart(); inp.value = ''; paint(); paintTabs(); };
    }
    inp.addEventListener('input', paint);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#c-add').click(); });
    $('#c-add').onclick = function () {
      var q = Math.max(0, Math.min(100000, parseInt(inp.value, 10) || 0));
      if (!q) return;
      var was = cart.calcs[calcId] > 0;
      cart.calcs[calcId] = q; saveCart(); paint(); paintTabs();
      toast(was ? t('updated') : t('added'));
    };
    paint();
  }
  function paintTabs() {
    document.querySelectorAll('[data-calc]').forEach(function (b) {
      var id = b.getAttribute('data-calc'), c = calcById(id);
      b.innerHTML = esc(L(c, 'name')) + (cart.calcs[id] > 0 ? '<span class="dot" aria-hidden="true"></span>' : '');
    });
  }

  function productsHTML() {
    var list = products.filter(function (p) {
      return !query || (L(p, 'name') + ' ' + p.name + ' ' + L(p, 'description')).toLowerCase().indexOf(query) >= 0;
    });
    var html = '';
    if (!loaded) return '<div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
    if (loadError) return '<div class="empty"><b>' + esc(t('load_err')) + '</b>' + esc(t('load_err_t')) + '</div>';
    if (!list.length) {
      return query ? '<div class="empty"><b>' + esc(t('not_found', { q: query })) + '</b></div>'
        : '<div class="empty"><b>' + esc(t('empty_shop')) + '</b></div>';
    }
    return html + '<div class="grid">' + list.map(cardHTML).join('') + '</div>';
  }

  function renderHome() {
    setChrome('home');
    document.title = t('title');
    var html = calcHTML() + '<div class="wrap">';
    if (demo) html += '<div class="demo-note">' + esc(t('demo')) + '</div>';
    if (products.length || !loaded) {
      html += '<div class="section-title"><h2>' + esc(t('products')) + '</h2>' +
        (products.length ? '<span>' + esc(t('count', { n: products.length })) + '</span>' : '') + '</div>';
      if (products.length > 8) {
        html += '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>' +
          '<span class="sr">' + esc(t('search')) + '</span><input id="q" type="search" placeholder="' + esc(t('search')) + '" autocomplete="off" value="' + esc(query) + '"></label>';

  function footerHTML() {
    return '<footer class="foot"><div class="wrap"><img src="/dokon/logo.png" alt="Musavvir Print" width="138" height="44"><p>' + esc(t('foot')) + '</p>' +
      '<div class="socials">' +
      '<a class="tg" href="' + LINKS.tg + '" target="_blank" rel="noopener">' + ICON.tg + esc(t('tg')) + '</a>' +
      '<a class="ig" href="' + LINKS.ig + '" target="_blank" rel="noopener">' + ICON.ig + 'Instagram</a>' +

  view.addEventListener('click', function (e) {
    var tab = e.target.closest('[data-calc]');
    if (tab) {
      calcId = tab.getAttribute('data-calc'); store.set('mp_calc', calcId);
      document.querySelectorAll('[data-calc]').forEach(function (b) { var on = b === tab; b.setAttribute('aria-pressed', on); b.setAttribute('aria-selected', on); });
      wireCalc();
      return;
    }
    var q = e.target.closest('[data-quick]');
    if (!q) return;
    e.preventDefault();
    var p = byId(q.getAttribute('data-quick'));
    if (!p) return;
    if (hasChoice(p)) { location.hash = '#/p/' + encodeURIComponent(p.id); return; }
    addToCart({ id: p.id, v: 0, o: [], a: [], q: 1 });
    toast(t('added'));
  });

  // ================= Tovar sahifasi =================
  function renderProduct(id) {
    setChrome('');
    var p = byId(id);
    if (!p) {
      view.innerHTML = '<div class="wrap"><a class="back" href="#/">' + esc(t('back')) + '</a><div class="empty"><b>' + esc(t('not_avail')) + '</b>' + esc(t('not_avail_t')) + '</div></div>';
      return;
    }
    document.title = L(p, 'name') + ' — Musavvir Print';
    var sel = { id: p.id, v: 0, o: p.options.map(function () { return 0; }), a: [], q: 1 };
    var imgs = p.images.length ? p.images : [null];
    var slides = imgs.map(function (u, i) {
      return '<div>' + (u ? '<img src="' + esc(u) + '" alt="' + esc(L(p, 'name')) + '"' + (i ? ' loading="lazy"' : '') + '>' : '<div class="ph">' + ICON_PHOTO + '</div>') + '</div>';
    }).join('');
    var dots = imgs.length > 1 ? '<div class="dots" aria-hidden="true">' + imgs.map(function (_, i) { return '<i' + (i ? '' : ' class="on"') + '></i>'; }).join('') + '</div>' : '';
    function group(kind, gi, title, choices, base) {
      return '<div class="opt-title">' + esc(title) + '</div><div class="pills" role="radiogroup" aria-label="' + esc(title) + '">' +
        choices.map(function (c, i) {
          var price = base ? sum(c.price) : (c.price ? '+' + sum(c.price) : '');
          return '<button type="button" class="pill" role="radio" data-kind="' + kind + '" data-g="' + gi + '" data-i="' + i + '" aria-checked="' + (i === 0) + '">' +
            esc(L(c, 'name')) + (price ? '<small>' + esc(price) + '</small>' : '') + '</button>';
        }).join('') + '</div>';
    }
    var html = '<div class="wrap pp"><button class="back" type="button" id="back">' + esc(t('back')) + '</button>' +
      '<div class="pp-grid"><div class="gallery"><div class="slides" id="slides">' + slides + '</div>' + dots + '</div><div>' +
      '<h1>' + esc(L(p, 'name')) + '</h1><div class="big-price" id="pp-price"></div>';
    if (p.is_bundle && p.print_qty) html += '<div class="bundle-note">' + esc(t('bundle_note', { n: p.print_qty })) + '</div>';
    if (p.variants.length) html += group('v', 0, t('choose'), p.variants, true);
    p.options.forEach(function (g, gi) { html += group('o', gi, L(g, 'name'), g.choices, false); });
    if (p.addons.length) {
      html += '<div class="opt-title">' + esc(t('extras')) + '</div><div class="checks">' + p.addons.map(function (a, i) {
        return '<label class="check"><input type="checkbox" data-a="' + i + '"><span>' + esc(L(a, 'name')) + '</span><b>+' + esc(sum(a.price)) + '</b></label>';
      }).join('') + '</div>';
    }
    var d = L(p, 'description');
    if (d) html += '<div class="desc">' + esc(d) + '</div>';
    html += '</div></div></div>' +
      '<div class="buybar"><div class="wrap"><div class="stepper"><button type="button" id="minus" aria-label="−">−</button><output id="qty">1</output><button type="button" id="plus" aria-label="+">+</button></div>' +
      '<button class="btn" type="button" id="add"></button></div></div>';
    view.innerHTML = html;
    window.scrollTo(0, 0);

    function refresh() {
      var info = lineInfo(p, sel);
      var sale = p.old_price > p.price && !p.variants.length && !p.options.length;
      $('#pp-price').innerHTML = esc(sum(info.unit)) + (sale ? '<s>' + esc(sum(p.old_price)) + '</s>' : '');
      $('#qty').textContent = sel.q;
      $('#add').textContent = t('to_cart') + ' · ' + sum(info.unit * sel.q);
    }
    refresh();
    $('#back').onclick = function () { if (history.length > 1) history.back(); else location.hash = '#/'; };
    view.querySelectorAll('.pill').forEach(function (b) {
      b.addEventListener('click', function () {
        var kind = b.getAttribute('data-kind'), g = +b.getAttribute('data-g'), i = +b.getAttribute('data-i');
        if (kind === 'v') sel.v = i; else sel.o[g] = i;
        b.parentNode.querySelectorAll('.pill').forEach(function (x) { x.setAttribute('aria-checked', x === b); });
        refresh();
      });
    });
    view.querySelectorAll('[data-a]').forEach(function (c) {
      c.addEventListener('change', function () {
        sel.a = [].slice.call(view.querySelectorAll('[data-a]:checked')).map(function (x) { return +x.getAttribute('data-a'); });
        refresh();
      });
    });
    $('#minus').onclick = function () { sel.q = Math.max(1, sel.q - 1); refresh(); };
    $('#plus').onclick = function () { sel.q = Math.min(1000, sel.q + 1); refresh(); };
    $('#add').onclick = function () {
      addToCart({ id: p.id, v: sel.v, o: sel.o.slice(), a: sel.a.slice(), q: sel.q });
      toast(t('added'));
      var b = $('#add'); b.textContent = t('go_cart'); b.onclick = function () { location.hash = '#/savat'; };
    };
    var sl = $('#slides');
    if (imgs.length > 1) sl.addEventListener('scroll', function () {
      var i = Math.round(sl.scrollLeft / sl.clientWidth);
      view.querySelectorAll('.dots i').forEach(function (d, j) { d.classList.toggle('on', i === j); });
    }, { passive: true });
  }

  // ================= Savat =================
  function renderCart() {
    setChrome('cart');
    document.title = t('cart') + ' — Musavvir Print';
    var calcLines = calcs.filter(function (c) { return cart.calcs[c.id] > 0; });
    var html = '<div class="wrap cart"><h1>' + esc(t('cart')) + '</h1>';
    if (!calcLines.length && !cart.items.length) {
      view.innerHTML = html + '<div class="empty"><b>' + esc(t('cart_empty')) + '</b>' + esc(t('cart_empty_t')) +
        '<div style="margin-top:18px"><a class="btn" href="#/" style="max-width:280px;margin:0 auto">' + esc(t('to_shop')) + '</a></div></div></div>';
      return;
    }
    html += '<div class="lines">';
    calcLines.forEach(function (c) {
      var q = cart.calcs[c.id], up = tierPrice(c, q);
      html += '<div class="line"><div class="thumb print">' + esc(L(c, 'name')) + '</div><div>' +
        '<h4>' + esc(t('print_line', { f: L(c, 'name') })) + '</h4><div class="meta">' + q + ' × ' + esc(sum(up)) + '</div>' +
        '<div class="row"><div class="acts"><button type="button" class="rm" data-edit-calc="' + esc(c.id) + '">' + esc(t('change')) + '</button>' +
        '<button type="button" class="rm" data-rm-calc="' + esc(c.id) + '">' + esc(t('remove')) + '</button></div><span class="sum">' + esc(sum(q * up)) + '</span></div></div></div>';
    });
    cart.items.forEach(function (it, i) {
      var p = byId(it.id);
      if (!p) {
        html += '<div class="line gone"><div class="thumb"><div class="ph">' + ICON_PHOTO + '</div></div><div><h4>' + esc(t('gone')) + '</h4>' +
          '<div class="meta">' + esc(t('gone_t')) + '</div><button type="button" class="rm" data-rm="' + i + '">' + esc(t('remove')) + '</button></div></div>';
        return;
      }
      var info = lineInfo(p, it);
      var meta = info.parts.concat([sum(info.unit)]).join(' · ');
      var thumb = p.images[0] ? '<img src="' + esc(p.images[0]) + '" alt="">' : '<div class="ph">' + ICON_PHOTO + '</div>';
      html += '<div class="line"><a class="thumb" href="#/p/' + encodeURIComponent(p.id) + '">' + thumb + '</a><div>' +
        '<h4>' + esc(L(p, 'name')) + '</h4><div class="meta">' + esc(meta) + '</div>' +
        '<div class="row"><div class="stepper"><button type="button" data-dec="' + i + '" aria-label="−">−</button><output>' + it.q + '</output>' +
        '<button type="button" data-inc="' + i + '" aria-label="+">+</button></div><span class="sum">' + esc(sum(info.unit * it.q)) + '</span></div>' +
        '<button type="button" class="rm" data-rm="' + i + '">' + esc(t('remove')) + '</button></div></div>';
    });
    html += '</div>';

    var tt = totals(), free = tt.free >= FREE_FROM;
    html += '<div class="summary"><div class="total"><span>' + esc(t('total')) + '</span><span>' + esc(sum(tt.total)) + '</span></div>' +
      '<div class="meter' + (free ? ' done' : '') + '">' + esc(free ? t('free_ok') : t('free_need', { n: FREE_FROM - tt.free })) +
      (free ? '' : '<div class="bar"><i style="width:' + Math.min(100, tt.free / FREE_FROM * 100) + '%"></i></div>') + '</div></div>';

    var hasGone = cart.items.some(function (it) { return !byId(it.id); });
    var needPhotos = calcLines.length || cart.items.some(function (it) { var p = byId(it.id); return p && (p.print_qty || p.options.length); });
    html += '<form class="checkout" id="checkout" novalidate><h3>' + esc(t('order')) + '</h3>' +
      '<label class="f">' + esc(t('phone')) + '<div class="field"><span class="pre">+998</span><input id="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="12" placeholder="90 123 45 67"></div></label>' +
      '<label class="f" for="address">' + esc(t('addr')) + '</label>' +
      '<div class="field" style="margin-top:-8px"><textarea id="address" rows="2" maxlength="300" placeholder="' + esc(t('addr_ph')) + '"></textarea>' +
      '<button type="button" class="loc' + (loc ? ' set' : '') + '" id="loc"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="loc-label">' + esc(loc ? t('loc_ok') : t('loc')) + '</span></button></div>' +
      '<p class="hint" style="margin:-6px 0 0">' + esc(t('bts')) + '</p>' +
      '<input class="hp" type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<p class="err" id="err" role="alert" hidden></p>' +
      '<button class="retro-btn" type="submit" id="submit" style="margin-top:4px"' + (hasGone ? ' disabled' : '') + '>' + esc(t('order')) + '</button>' +
      (needPhotos ? '<p class="hint" style="margin:0;text-align:center">' + esc(t('send_photos_after')) + '</p>' : '') +
      '</form></div>';
    view.innerHTML = html;

    var ph = $('#phone'), ad = $('#address');
    ph.value = draft.phone || ''; ad.value = draft.address || '';
    ph.addEventListener('input', function () {
      var d = ph.value.replace(/\D/g, '').replace(/^998/, '').slice(0, 9);
      ph.value = [d.slice(0, 2), d.slice(2, 5), d.slice(5, 7), d.slice(7, 9)].filter(Boolean).join(' ');
      draft.phone = ph.value; store.set('mp_checkout', draft);
    });
    ad.addEventListener('input', function () { draft.address = ad.value; store.set('mp_checkout', draft); });
    $('#loc').onclick = getLocation;
    view.querySelectorAll('[data-inc],[data-dec],[data-rm],[data-rm-calc],[data-edit-calc]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i;
        if (b.hasAttribute('data-edit-calc')) {
          calcId = b.getAttribute('data-edit-calc'); store.set('mp_calc', calcId); location.hash = '#/';
          setTimeout(function () { var q = $('#c-qty'); if (q) { q.scrollIntoView({ block: 'center' }); q.focus(); } }, 60);
          return;
        }
        if (b.hasAttribute('data-rm-calc')) delete cart.calcs[b.getAttribute('data-rm-calc')];
        if (b.hasAttribute('data-inc')) { i = +b.getAttribute('data-inc'); cart.items[i].q = Math.min(1000, cart.items[i].q + 1); }
        if (b.hasAttribute('data-dec')) { i = +b.getAttribute('data-dec'); cart.items[i].q = Math.max(1, cart.items[i].q - 1); }
        if (b.hasAttribute('data-rm')) { i = +b.getAttribute('data-rm'); cart.items.splice(i, 1); }
        saveCart(); keepScroll(renderCart);
      });
    });
    $('#checkout').addEventListener('submit', submitOrder);
  }
  function keepScroll(fn) { var y = window.scrollY; fn(); window.scrollTo(0, y); }

  function getLocation() {
    var label = $('#loc-label');
    if (!navigator.geolocation) return locFail();
    label.textContent = t('loc_wait');
    navigator.geolocation.getCurrentPosition(function (p) {
      loc = { lat: p.coords.latitude, lon: p.coords.longitude };
      label.textContent = t('loc_ok'); $('#loc').classList.add('set');
    }, locFail, { enableHighAccuracy: true, timeout: 15000 });
  }
  function locFail() { var l = $('#loc-label'); if (l) l.textContent = t('loc'); showErr(t('e_loc')); }
  function showErr(s) { var e = $('#err'); if (!e) return; e.textContent = s; e.hidden = !s; }

  // Adminga yuboriladigan tayyor matn (mijoz tilida)
  function buildMessage(orderId, phone, total, free) {
    var lines = [t('m_hello', { n: orderId ? ' №' + orderId : '' }), ''];
    calcs.forEach(function (c) {
      var q = cart.calcs[c.id];
      if (q > 0) lines.push('• ' + t('print_line', { f: L(c, 'name') }) + ' — ' + q + ' ' + t('pcs') + ': ' + sum(q * tierPrice(c, q)));
    });
    cart.items.forEach(function (it) {
      var p = byId(it.id); if (!p) return;
      var info = lineInfo(p, it);
      lines.push('• ' + L(p, 'name') + (info.parts.length ? ' (' + info.parts.join(', ') + ')' : '') + ' — ' + it.q + ' ' + t('pcs') + ': ' + sum(info.unit * it.q));
    });
    lines.push('', t('m_total', { s: sum(total) }));
    if (free) lines.push(t('m_free'));
    lines.push(t('m_phone', { p: phone }));
    return lines.join('\n');
  }

  function submitOrder(e) {
    e.preventDefault();
    var digits = $('#phone').value.replace(/\D/g, '');
    var address = $('#address').value.trim();
    if (digits.length !== 9) { showErr(t('e_phone')); $('#phone').focus(); return; }
    if (address.length < 3 && !loc) { showErr(t('e_addr')); $('#address').focus(); return; }
    showErr('');
    var btn = $('#submit');
    btn.disabled = true; btn.textContent = t('sending');
    fetch('/api/shop-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        phone: digits, address: address, lat: loc && loc.lat, lon: loc && loc.lon, src: SRC,
        website: $('#website').value,
        cart: { calcs: cart.calcs, items: cart.items.map(function (it) { return { id: it.id, v: it.v, o: it.o, a: it.a, q: it.q }; }) }
      })
    }).then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error(d.error || t('e_net'));
        var needPhotos = Object.keys(cart.calcs).some(function (k) { return cart.calcs[k] > 0; }) ||
          cart.items.some(function (it) { var p = byId(it.id); return p && (p.print_qty || p.options.length); });
        var msg = buildMessage(d.id, d.phone || ('+998' + digits), d.total, d.free);
        if (needPhotos) msg += '\n' + t('m_photos');
        cart = { calcs: {}, items: [] }; saveCart();
        renderDone(d, msg, needPhotos);
      })
      .catch(function (err) {
        btn.disabled = false; btn.textContent = t('order');
        showErr(err.message || t('e_net'));
      });
  }

  function renderDone(d, msg, needPhotos) {
    setChrome('');
    var num = d.id ? ' №' + d.id : '';
    var tgLink = LINKS.admin + '?text=' + encodeURIComponent(msg);
    view.innerHTML = '<section class="done-band"><div class="wrap"><div class="done-card">' +
      '<div class="tick"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg></div>' +
      '<h1>' + esc(t('done', { n: num })) + '</h1><p>' + esc(t('done_t')) + '</p>' +
      '<p style="margin-top:10px;font-weight:700;color:var(--ink)">' + esc(needPhotos ? t('done_photos') : t('done_msg')) + '</p>' +
      '<a class="retro-btn" href="' + esc(tgLink) + '" target="_blank" rel="noopener">' + ICON.tg + esc(t('write_tg')) + '</a>' +
      '<div class="msg-preview"><b>' + esc(t('msg_title')) + '</b>' + esc(msg) + '</div>' +
      '<div class="alt"><button type="button" id="copy">' + esc(t('copy')) + '</button>' +
      '<a href="' + LINKS.igdm + '" target="_blank" rel="noopener">' + ICON.ig + esc(t('ig')) + '</a></div>' +
      '<a class="home" href="#/">' + esc(t('home')) + '</a>' +
      '</div></div></section>';
    window.scrollTo(0, 0);
    $('#copy').onclick = function () {
      var done = function () { toast(t('copied')); };
      if (navigator.clipboard) navigator.clipboard.writeText(msg).then(done, fallback); else fallback();
      function fallback() {
        var ta = document.createElement('textarea'); ta.value = msg; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (e) {} ta.remove();
      }
    };
  }

  // ================= Yo'naltirish =================
  function setChrome(which) {
    $('#top-white').hidden = which === 'home';
    document.querySelectorAll('[data-nav]').forEach(function (a) {
      var on = a.getAttribute('data-nav') === which;
      a.classList.toggle('on', on);
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  function route() {
    var h = location.hash || '#/';
    var m = h.match(/^#\/p\/(.+)$/);
    if (h === '#/savat' && !loaded) { setChrome('cart'); view.innerHTML = '<div class="wrap cart"><h1>' + esc(t('cart')) + '</h1><div class="skeleton" style="aspect-ratio:3/1"></div></div>'; }
    else if (h === '#/savat') renderCart();
    else if (m && loaded) renderProduct(decodeURIComponent(m[1]));
    else if (m) { setChrome(''); view.innerHTML = '<div class="wrap" style="padding-top:20px"><div class="skeleton" style="aspect-ratio:1"></div></div>'; }
    else renderHome();
  }
  window.addEventListener('hashchange', function () { route(); if (!/^#\/savat/.test(location.hash)) window.scrollTo(0, 0); });

  paintChrome();
  updateCount();
  route();
  load();
})();
</script>
</body>
</html>
